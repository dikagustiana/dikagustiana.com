# project_id is rewired to the rebuilt project once it exists; see
# docs/SESSION_LOG.md. The old ref (rhwzvgklasvitocbbhvi) is a deleted project.
project_id = "PENDING"

# council-review is the only edge function left after the rebuild. The quant,
# remora and personal-finance functions were cut with their modules.
#
# verify_jwt = true: the platform rejects a missing or invalid JWT before the
# function body runs. The body then re-checks the admin role against user_roles
# server-side (index.ts:100-112), so the gate does not depend on the frontend
# RequireAdmin guard. Both layers are deliberate.
#
# Historical note: the eight quant-* and remora-* functions ran verify_jwt =
# false while each constructed a SUPABASE_SERVICE_ROLE_KEY client internally,
# meaning any unauthenticated caller could drive service-role writes that bypass
# RLS. Nothing in this project ships with verify_jwt = false.
[functions.council-review]
verify_jwt = true
