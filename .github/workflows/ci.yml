# Every check in this repository's history ran only when someone remembered to
# run it — and the audit trail shows what that costs: a typecheck that compiled
# zero files for months, a lint that had been failing, a test whose result
# depended on the machine's timezone. This workflow is the memory.
#
# Tests run with TZ pinned to America/Chicago — deliberately NOT UTC, so any
# code that quietly assumes UTC fails here first (the formatDate bug shipped
# because every check ran in UTC).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --max-warnings holds the line at the current count (35). New warnings
      # fail; paying warnings down lowers the ceiling deliberately, not silently.
      - run: npx eslint . --max-warnings=35
      # tsc -b --force: the root tsconfig is solution-style ("files": []), so a
      # bare `tsc --noEmit` compiles NOTHING and exits 0. Do not "simplify" this.
      - run: npm run typecheck
      # JSON report + count floor: a test file that throws during IMPORT
      # contributes zero tests — the total shrinks without a red. The
      # assert step fails the build when the count drops below the floor
      # in scripts/assert-test-count.mjs.
      - run: npx vitest run --reporter=default --reporter=json --outputFile=vitest-report.json
        env:
          TZ: America/Chicago
      - run: node scripts/assert-test-count.mjs vitest-report.json
      # The financial-statement tie-out checker (PRD §A6, scripts/fs_check.py)
      # and its tests: Python standard library only, on the runner's own
      # python3, nothing installed. A test module that fails to import is an
      # error here, and since Python 3.12 a run that finds no tests exits 5.
      - run: python3 -m unittest discover -s scripts/tests -v
      # The extracted PHE FY2024 statements, proven against their own
      # arithmetic and PRD §A6's golden table (golden.json beside them).
      - run: python3 scripts/fs_check.py data/fs/phe/fy2024/statements.json --failures-only
      # The world engine's own check (scripts/world/check-engine.mjs): imports,
      # free names and load order from its entry. Files not yet wired are
      # listed as pending and do not fail; wired files must be clean.
      - run: npm run check:world
      - run: npm run build
