<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dika Gustiana</title>
    <meta name="description" content="Finance, accounting, and green transition economics. Research and analysis by Dika Gustiana." />

    <!-- All three derive from the one source image, public/logo.png. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The homepage hero's headline face, the one weight it uses
         (src/index.css, docs/hero-weave-prd.md §3). Vite rewrites the path
         to the same hashed file the @font-face names. -->
    <link rel="preload" href="/node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The editorial serif, Spectral, at the two weights the glimpse's cards
         use (src/index.css): its titles and decks are in view on load under
         the homepage hero, and must not reflow when the face arrives
         (docs/home-hero-v2.md R10). -->
    <link rel="preload" href="/fonts/spectral-normal-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/spectral-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- The feed (dist/rss.xml, written by scripts/prerender.mjs). -->
    <link rel="alternate" type="application/rss+xml" title="Dika Gustiana" href="/rss.xml" />

    <!-- Crawlers (WhatsApp's included) do not execute JavaScript, so THESE
         tags are the share card for every route that is not pre-rendered.
         og:image must be ABSOLUTE (crawlers reject relative URLs) and
         1200×630 (summary_large_image renders a square logo as a tiny
         thumbnail). Published essay routes get their own tags from
         scripts/prerender.mjs at build time. -->
    <meta property="og:title" content="Dika Gustiana" />
    <meta property="og:description" content="Finance, accounting, and green transition economics. Research and analysis by Dika Gustiana." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dikagustiana.com/" />
    <meta property="og:image" content="https://dikagustiana.com/og-image.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dikagustiana.com/og-image.png" />
  </head>

  <body>
    <!-- The app draws every page with JavaScript; without it, the homepage
         hero's headline is still real text (docs/hero-weave-prd.md §1,
         criterion 1). This shell serves every route, so it shows wherever
         a reader arrives with JavaScript off. -->
    <noscript>
      <section class="weave-hero-static" aria-labelledby="weave-hero-static-title">
        <h1 id="weave-hero-static-title">Democratising knowledge. Rebuilding industry.</h1>
        <p>Exploring how to accelerate both, and how every Indonesian can share in them.</p>
      </section>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
